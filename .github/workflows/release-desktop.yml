name: Release Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: rust-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "リハぐり v__VERSION__"
          releaseBody: |
            <!-- このバージョンの概要を1〜2文で記載 -->

            ### ✨ 新機能

            - **機能名**：説明

            ### 🔧 改善

            - 改善内容

            ### 🐛 バグ修正

            - 修正内容

            ---

            ### 📥 Windows版のダウンロード・インストール

            1. 下部の **「Assets」** から `rehab-grid___VERSION___x64-setup.exe` をダウンロードして実行してください。
            2. 対応環境：Windows 10 / 11（64bit）・オフライン動作対応（外部サーバーへのデータ送信はありません）。
            3. **アップデートの方へ**：旧バージョンが入っている場合も、そのまま上書きインストールで更新できます（保存データは引き継がれます）。
            4. 実行時に「Windows によって PC が保護されました」と表示された場合は、**「詳細情報」→「実行」** を選択してください。

            ### 🔗 詳細な変更履歴

            技術的な詳細や過去の変更点は [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) をご覧ください。
          releaseDraft: true
          prerelease: false
