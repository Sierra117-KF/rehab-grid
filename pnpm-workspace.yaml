packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 でビルドスクリプトの実行を許可するパッケージ
# （pnpm 10 の onlyBuiltDependencies から移行）
allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true

# 依存グラフ全体に適用するバージョン固定
# （pnpm 10 の package.json > pnpm.overrides から移行）
overrides:
  "@types/react": "19.2.17"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  # minimatch@3.x は brace-expansion@1.x の CJS 単一関数エクスポートに依存するため
  # （5.x は { expand } 形式）、5.x へ上げず 1.x 系の修正版に固定する
  "minimatch@>=3.0.0 <4.0.0>brace-expansion": "1.1.18"
  "rollup@>=4.0.0 <4.59.0": "4.59.0"
  "ajv@<6.14.0": "6.14.0"
  "flatted": "3.4.2"
  "brace-expansion": "5.0.9"
  "picomatch": "4.0.4"
  "vite": "7.3.5"
  "postcss": "8.5.23"
  "ws": "8.21.0"
  "js-yaml": "4.3.1"
  # postcss が要求する nanoid@3.x のみを対象にする範囲指定
  # （packages/core の直接依存 nanoid@5.x をダウングレードしないため）
  "nanoid@<3.3.17": "3.3.17"
  "@babel/core": "7.29.7"
  # next の optionalDependencies が sharp@^0.34.5（libvips 脆弱性あり）を要求するため上書き
  # 本プロジェクトは output: "export" + images.unoptimized のため sharp は実行されない
  "sharp": "0.35.3"
