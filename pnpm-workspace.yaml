packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 でビルドスクリプトの実行を許可するパッケージ
# （pnpm 10 の onlyBuiltDependencies から移行）
allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true

# 依存グラフ全体に適用するバージョン固定
# （pnpm 10 の package.json > pnpm.overrides から移行）
overrides:
  "@types/react": "19.2.17"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "minimatch@>=3.0.0 <4.0.0>brace-expansion": "1.1.13"
  "rollup@>=4.0.0 <4.59.0": "4.59.0"
  "ajv@<6.14.0": "6.14.0"
  "flatted": "3.4.2"
  "brace-expansion": "5.0.6"
  "picomatch": "4.0.4"
  "vite": "7.3.5"
  "postcss": "8.5.14"
  "ws": "8.21.0"
  "js-yaml": "4.2.0"
  "@babel/core": "7.29.7"
